groups:
  - name: hosts-alerts
    rules:
      - alert: HostDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host DOWN: {{ $labels.instance }}"
          description: "node_exporter недоступен более 2 минут"

      - alert: HostDiskUsageCritical
        expr: |
          (
            100 - (
              node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|overlay|squashfs|ramfs",mountpoint!~"/run.*|/var/lib/docker.*"}
              /
              node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs|overlay|squashfs|ramfs",mountpoint!~"/run.*|/var/lib/docker.*"}
              * 100
            )
          ) > 98
          and
          node_filesystem_readonly{fstype!~"tmpfs|fuse.lxcfs|overlay|squashfs|ramfs",mountpoint!~"/run.*|/var/lib/docker.*"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Диск >98%: {{ $labels.instance }}"
          description: "ФС {{ $labels.mountpoint }} на {{ $labels.instance }} заполнена более чем на 98%"

      - alert: HostCpuUsageCritical
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 97
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU >97%: {{ $labels.instance }}"
          description: "Средняя загрузка CPU на {{ $labels.instance }} выше 97% более 5 минут"

      - alert: HostMemoryUsageCritical
        expr: |
          (
            1 - (
              node_memory_MemAvailable_bytes
              /
              node_memory_MemTotal_bytes
            )
          ) * 100 > 95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAM >95%: {{ $labels.instance }}"
          description: "Использование оперативной памяти на {{ $labels.instance }} выше 95% более 5 минут"

      - alert: HostNetworkUsageCritical
        expr: |
          (
            (
              rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br.*|virbr.*|tun.*"}[5m])
              +
              rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br.*|virbr.*|tun.*"}[5m])
            )
            /
            on(instance, device) node_network_speed_bytes{device!~"lo|docker.*|veth.*|br.*|virbr.*|tun.*"}
          ) * 100 > 95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Сеть >95%: {{ $labels.instance }}"
          description: "Интерфейс {{ $labels.device }} на {{ $labels.instance }} загружен более чем на 95%"
